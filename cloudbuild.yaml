steps:
  # Build the React app
  - name: 'node:18'
    entrypoint: npm
    args: ['ci']
    dir: '.'

  - name: 'node:18'
    entrypoint: npm
    args: ['run', 'build']
    dir: '.'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/techadivas-website:$COMMIT_SHA', '.']

  # Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/techadivas-website:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'techadivas-website'
      - '--image'
      - 'gcr.io/$PROJECT_ID/techadivas-website:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/techadivas-website:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY 